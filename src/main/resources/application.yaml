server:
  port: 8083

spring:
  application:
    name: ride-service
  datasource:
      url: jdbc:mysql://localhost:3306/ride_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: localhost
      password: Shashank@3549
  jpa:
        properties:
          hibernate.jdbc.time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer     //converts string to bytes
      value-serializer: org.apache.kafka.common.serialization.StringSerializer    //converts json to bytes

      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false


    consumer:
      group-id: ride-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.goon.locationsync.service.request.LocationEvent
        spring.json.trusted.packages: com.goon.locationsync.service.request    //works in coordination with type_id header
    listener:
      ack-mode: manual_immediate
app:
  kafka:
    topics:
      ride-events: ride-events
