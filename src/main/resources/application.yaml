server:
  port: 8083

spring:
  application:
    name: ride-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/goon-internal-auth
          audiences: ride-service
  datasource:
    url: jdbc:mysql://localhost:3306/ride_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: root
    password: Shashank3549
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer     //converts string to bytes
      value-serializer: org.apache.kafka.common.serialization.StringSerializer    //converts json to bytes

      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false


    consumer:
      group-id: ride-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
app:
  kafka:
    topics:
      ride-events: ride-events
  secret-key: HBJSHUSIUSHTSJBHS732r2fufifh43fuihiaudi
  outbox:
    delay-ms: 500
